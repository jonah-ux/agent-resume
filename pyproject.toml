[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_resume"
version = "0.1.0"
description = "portable agent continuation records"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
agent-resume = "agent_resume.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
