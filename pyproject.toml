[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_resume"
version = "0.2.0"
description = "portable agent continuation records"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
agent-resume = "agent_resume.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
